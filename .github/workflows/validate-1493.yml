name: Validate forwarded identity 1493
on:
  push:
    branches: [validation/1493-b72c]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: replay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_FORWARDED_REPLAY_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/replay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci > install.log 2>&1
      - run: npx prisma generate > prisma.log 2>&1
      - name: Targeted security regression and coverage
        id: targeted
        continue-on-error: true
        run: >-
          npx jest --runInBand --forceExit --runTestsByPath
          src/middleware/requireAuth.test.ts src/services/forwardedIdentityReplayStore.test.ts
          tests/integration/requireAuth.test.ts tests/integration/forwardedIdentityReplayStore.test.ts
          --coverage --collectCoverageFrom=src/middleware/requireAuth.ts
          --collectCoverageFrom=src/services/forwardedIdentityReplayStore.ts
          > targeted.log 2>&1
      - name: Lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Build
        continue-on-error: true
        run: npm run build > build.log 2>&1
      - name: Full suite
        continue-on-error: true
        run: npm test -- --runInBand > full-test.log 2>&1
      - name: Migration policy
        continue-on-error: true
        run: CHECKSUM_CI_SKIP_MISSING=1 npx tsx scripts/check-migrations.ts > migrations.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-1493
          path: |
            *.log
            coverage/coverage-final.json
      - name: Enforce security tests
        if: always()
        env:
          RESULT: ${{ steps.targeted.outcome }}
        run: test "$RESULT" = success

  baseline:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe44ef290e17abeb33ad9d1587c5e0edc0f2dbd1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci > install-baseline.log 2>&1
      - run: npx prisma generate > prisma-baseline.log 2>&1
      - name: Reproduce permanent legacy credential
        run: |
          cat > baseline-replay.mts <<'JS'
          import express from 'express';
          import request from 'supertest';
          import { createHmac } from 'node:crypto';
          import { requireAuth } from './src/middleware/requireAuth.js';
          process.env.TRUST_FORWARDED_USER_ID = 'true';
          process.env.FORWARDED_USER_ID_SECRET = 'baseline-test-only-secret';
          const app = express();
          app.get('/protected', requireAuth, (_req, res) => res.sendStatus(200));
          const signature = createHmac('sha256', process.env.FORWARDED_USER_ID_SECRET).update('captured').digest('hex');
          for (const now of [1700000000000, 1900000000000]) {
            Date.now = () => now;
            const response = await request(app).get('/protected').set('x-user-id', 'captured').set('x-gateway-signature', signature);
            console.log('Same untimed signature at', now, 'returned', response.status);
            if (response.status !== 200) throw new Error('Baseline reproduction changed');
          }
          JS
          npx tsx baseline-replay.mts > regression-baseline.log 2>&1
      - name: Baseline lint
        continue-on-error: true
        run: npm run lint > lint-baseline.log 2>&1
      - name: Baseline typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck-baseline.log 2>&1
      - name: Baseline build
        continue-on-error: true
        run: npm run build > build-baseline.log 2>&1
      - name: Baseline tests
        continue-on-error: true
        run: npm test -- --runInBand > full-test-baseline.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-1493
          path: '*.log'
